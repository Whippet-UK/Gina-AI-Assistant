name: Apply StreamInject import fix

on:
  push:
    branches:
      - Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED
          fetch-depth: 0

      - name: Patch StreamInject v2.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          server = Path('server.ts')
          text = server.read_text(encoding='utf-8')
          old = 'app.use(express.json({ limit: "50mb" }));'
          new = 'app.use(express.json({ limit: "512mb" }));'
          if old not in text:
              raise SystemExit('Expected server JSON limit was not found')
          text = text.replace(old, new, 1)
          server.write_text(text, encoding='utf-8')

          ui = Path('src/components/StreamInjectStudio.tsx')
          text = ui.read_text(encoding='utf-8')

          old = '<input type="file" accept="video/*" className="hidden" onChange={(e) => handleFileUpload(e, "gameplay")} />'
          new = '<input type="file" accept=".mp4,.mkv,.webm,.mov,.avi,.m4v,.wmv,.flv,.mpeg,.mpg,.ts,.mts,.m2ts,.3gp,video/*" className="hidden" onChange={(e) => handleFileUpload(e, "gameplay")} />'
          if old not in text:
              raise SystemExit('Expected gameplay upload input was not found')
          text = text.replace(old, new, 1)

          intro_pattern = re.compile(r'(Step 2A: Intro Video Hook \(Optional\).*?<select[\s\S]*?</select>)', re.M)
          m = intro_pattern.search(text)
          if not m:
              raise SystemExit('Expected Step 2A intro selector was not found')
          intro_block = m.group(1)
          if 'handleFileUpload(e, "intro")' not in intro_block:
              intro_block += '\n                <label className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 cursor-pointer transition-colors">\n                  <Upload className="w-3.5 h-3.5" /> Upload Intro\n                  <input type="file" accept=".mp4,.mkv,.webm,.mov,.avi,.m4v,.wmv,.flv,.mpeg,.mpg,.ts,.mts,.m2ts,.3gp,video/*" className="hidden" onChange={(e) => handleFileUpload(e, "intro")} />\n                </label>'
              text = text[:m.start(1)] + intro_block + text[m.end(1):]

          outro_pattern = re.compile(r'(Step 2B: Outro / Endscreen \(Optional\).*?<select[\s\S]*?</select>)', re.M)
          m = outro_pattern.search(text)
          if not m:
              raise SystemExit('Expected Step 2B outro selector was not found')
          outro_block = m.group(1)
          if 'handleFileUpload(e, "outro")' not in outro_block:
              outro_block += '\n                <label className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 cursor-pointer transition-colors">\n                  <Upload className="w-3.5 h-3.5" /> Upload CTA\n                  <input type="file" accept=".mp4,.mkv,.webm,.mov,.avi,.m4v,.wmv,.flv,.mpeg,.mpg,.ts,.mts,.m2ts,.3gp,video/*" className="hidden" onChange={(e) => handleFileUpload(e, "outro")} />\n                </label>'
              text = text[:m.start(1)] + outro_block + text[m.end(1):]

          old = '          fetchMediaFiles();\n        }\n      } catch (err) {'
          new = '          await fetchMediaFiles();\n        } else {\n          throw new Error(data.error || "Upload failed");\n        }\n      } catch (err) {'
          if old not in text:
              raise SystemExit('Expected upload error block was not found')
          text = text.replace(old, new, 1)

          ui.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/StreamInjectStudio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve StreamInject video imports and CTA selection"
          git push origin Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED

      # Keep this workflow idempotent: a later push will see the patched strings and exit cleanly.
