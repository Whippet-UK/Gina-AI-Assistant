name: Apply StreamInject import fix

on:
  push:
    branches:
      - Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED
          fetch-depth: 0

      - name: Patch StreamInject v2.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VIDEO_ACCEPT = '.mp4,.mkv,.webm,.mov,.avi,.m4v,.wmv,.flv,.mpeg,.mpg,.ts,.mts,.m2ts,.3gp,video/*'

          server = Path('server.ts')
          text = server.read_text(encoding='utf-8')
          text = text.replace('app.use(express.json({ limit: "50mb" }));', 'app.use(express.json({ limit: "512mb" }));', 1)
          server.write_text(text, encoding='utf-8')

          ui = Path('src/components/StreamInjectStudio.tsx')
          text = ui.read_text(encoding='utf-8')

          gameplay_old = '<input type="file" accept="video/*" className="hidden" onChange={(e) => handleFileUpload(e, "gameplay")} />'
          gameplay_new = f'<input type="file" accept="{VIDEO_ACCEPT}" className="hidden" onChange={(e) => handleFileUpload(e, "gameplay")} />'
          text = text.replace(gameplay_old, gameplay_new, 1)

          def add_role_upload(text, role, label):
              pattern = re.compile(r'(<select\s+value={' + re.escape(role) + r'}[\s\S]*?</select>)', re.M)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Expected {role} selector was not found')
              block = match.group(1)
              if f'handleFileUpload(e, "{role[:-4]}")' in block:
                  return text
              field = role[:-4]
              control = f'''\n                <label className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 cursor-pointer transition-colors">\n                  <Upload className="w-3.5 h-3.5" /> {label}\n                  <input type="file" accept="{VIDEO_ACCEPT}" className="hidden" onChange={{(e) => handleFileUpload(e, "{field}")}} />\n                </label>'''
              return text[:match.end(1)] + control + text[match.end(1):]

          text = add_role_upload(text, 'introPath', 'Upload Intro')
          text = add_role_upload(text, 'outroPath', 'Upload CTA')

          upload_tail = '          fetchMediaFiles();\n        }\n      } catch (err) {'
          text = text.replace(upload_tail, '          await fetchMediaFiles();\n        } else {\n          throw new Error(data.error || "Upload failed");\n        }\n      } catch (err) {', 1)

          ui.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/StreamInjectStudio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve StreamInject video imports and CTA selection"
          git push origin Gina-AI-Factory-v1.17.67-STORY-STALL-FIXED
