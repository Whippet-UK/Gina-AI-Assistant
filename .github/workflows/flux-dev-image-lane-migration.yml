name: FLUX Dev image-lane migration

on:
  push:
    branches:
      - fix/flux-dev-image-lane

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply FLUX.1 Dev migration
        env:
          BASE_SHA: a06193332748cd27113a6ce881156f6f09776650
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"Expected at least {minimum} occurrence(s) in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")
              print(f"{path}: {count} replacement(s)")

          replace("src/components/PromptStudio.tsx",
                  "workflowModelValue === 'FLUX.1-lite-pure-Q4_0.gguf'\n      ? 'FLUX.1 Lite GGUF Q4_0'",
                  "workflowModelValue === 'flux1-dev-Q4_K_M.gguf'\n      ? 'FLUX.1 Dev GGUF Q4_K_M'")
          replace("src/components/PromptStudio.tsx", "setSteps(highPrecisionText ? 4 : 24)", "setSteps(highPrecisionText ? 25 : 24)")
          replace("src/components/PromptStudio.tsx", "FLUX.1 Lite", "FLUX.1 Dev")

          replace("src/components/gina-image/GinaImageSettings.tsx", "FLUX.1 Lite", "FLUX.1 Dev")
          replace("src/components/gina-image/GinaImageSettings.tsx", "Q4_K_S UNet · 4-step generation", "Q4_K_M UNet · 25-step generation")
          replace("src/components/gina-image/GinaImageSettings.tsx",
                  "onChangeBaseModel('Juggernaut-XL_v9_RunDiffusionPhoto_v2.safetensors');",
                  "onChangeBaseModel('flux1-dev-Q4_K_M.gguf');", 1)

          replace("server/capabilities/CapabilityManager.ts",
                  "{ id:'flux-lite-gguf', fileName:'FLUX.1-lite-pure-Q4_0.gguf', category:'unet', relative:'models/unet/FLUX.1-lite-pure-Q4_0.gguf', purpose:'FLUX.1 Lite high-precision image generation', enabled:true },",
                  "{ id:'flux-dev-gguf', fileName:'flux1-dev-Q4_K_M.gguf', category:'unet', relative:'models/unet/flux1-dev-Q4_K_M.gguf', purpose:'FLUX.1 Dev Q4_K_M image generation', enabled:true },")
          replace("server/capabilities/CapabilityManager.ts", "has('flux-lite-gguf')", "has('flux-dev-gguf')")
          replace("server/capabilities/CapabilityManager.ts",
                  "{id:'flux-lite-image',label:'FLUX.1 Lite High Precision',type:'image',status:flux&&imageW.length?'validated':flux?'installed':'unavailable',workflowIds:imageW.filter((id:string)=>/flux_lite/i.test(id)),modelIds:['flux-lite-gguf','clip-l','t5xxl-fp8'],notes:['Optional high-precision text-in-image lane using T5-XXL FP8.']},",
                  "{id:'flux-dev-image',label:'FLUX.1 Dev Q4_K_M',type:'image',status:flux&&imageW.length?'validated':flux?'installed':'unavailable',workflowIds:imageW.filter((id:string)=>/flux/i.test(id)),modelIds:['flux-dev-gguf','clip-l','t5xxl-fp8'],notes:['Optional FLUX.1 Dev text-in-image lane using T5-XXL FP8.']},")

          replace("server.ts",
                  "  if (engine === 'qwen-coder') throw new Error('Qwen Coder is text-only and cannot route image generation. Switch to Qwen 2.5-VL Vision or Qwen3.5 Vision.');\n  if (!multimodal) throw new Error('Qwen 2.5-VL Vision Mode requires its mmproj projector.');\n  if (highPrecision) return {\n    workflowId: 'flux_lite_image',\n    generationModel: 'FLUX.1 Lite GGUF + UMT5 XXL',\n    lane: 'qwen-vision-flux-lite' as const\n  };",
                  "  if (engine === 'qwen-coder') throw new Error('Qwen Coder is text-only and cannot route image generation. Switch to a vision-capable image prompt engine.');\n  if (highPrecision) return {\n    workflowId: 'flux_lite_image',\n    generationModel: 'FLUX.1 Dev GGUF Q4_K_M + T5-XXL FP8',\n    lane: 'flux-dev' as const\n  };\n  if (!multimodal) throw new Error('The selected local vision engine requires its mmproj projector for Juggernaut image routing.');")
          replace("server.ts", "id: 'flux_lite',", "id: 'flux_dev',")
          replace("server.ts", "Optional high-precision image lane using FLUX.1 Lite GGUF with UMT5 XXL.", "FLUX.1 Dev Q4_K_M image lane using the genuine FLUX T5-XXL text encoder.")
          replace("server.ts", "FLUX.1 Lite GGUF & SDXL Juggernaut-XL", "FLUX.1 Dev GGUF & SDXL Juggernaut-XL")
          replace("server.ts", "function sanitizeLocalFluxLiteWorkflow()", "function sanitizeLocalFluxDevWorkflow()")
          replace("server.ts", "sanitizeLocalFluxLiteWorkflow", "sanitizeLocalFluxDevWorkflow")
          replace("server.ts", "Reconciled FLUX DualCLIPLoader", "Reconciled FLUX.1 Dev DualCLIPLoader")
          replace("server.ts",
                  "  if (workflowId === 'flux_lite_image') {\n    const llmStatus = await localLlm.getStatus();\n    if (llmStatus.engine !== 'qwen' || !llmStatus.multimodal) {\n      return res.status(409).json({ ok:false, error:'FLUX.1 Lite high-precision mode requires Qwen 2.5-VL Vision Mode with mmproj-F16.', workflowId, llmEngine:llmStatus.engine, multimodal:llmStatus.multimodal });\n    }\n  }\n\n",
                  "")
          replace("server.ts", "FLUX.1 Lite high-precision text mode cannot use Wan 2.1's UMT5 model", "FLUX.1 Dev text mode cannot use Wan 2.1's UMT5 model")

          replace("src/components/VRAMHistoryGraph.tsx", "FLUX Lite", "FLUX.1 Dev")
          replace("src/components/VRAMOomFrequencyChart.tsx", "flux_lite:", "flux_dev:")
          replace("src/components/VRAMOomFrequencyChart.tsx", "FLUX.1 Lite GGUF", "FLUX.1 Dev Q4_K_M")
          replace("src/components/VRAMOomFrequencyChart.tsx", "optional high-precision image generation", "FLUX.1 Dev image generation")
          replace("server/agent/ProjectMapManager.ts", "FLUX.1 Lite GGUF (high-precision alternate)", "FLUX.1 Dev Q4_K_M GGUF (alternate image lane)")
          replace("server/agent/ProjectMapManager.ts", "High-speed image generation with photorealism and high-precision lanes.", "High-speed image generation with photorealism and the FLUX.1 Dev Q4_K_M alternate lane.")
          replace("server/comfy/WorkflowRegistry.ts", "flux_lite_image.json remain the live workflow", "flux_lite_image.json remains the live FLUX.1 Dev workflow")
          replace("src/components/gina-image/GinaImagePreview.tsx", "Denoising with FLUX.1 Lite…", "Denoising with FLUX.1 Dev…")

          agents = Path("AGENTS.md")
          agents_text = agents.read_text(encoding="utf-8")
          entry = """
          ## 2026-09-29 — FLUX.1 Dev Q4_K_M Image-Lane Migration
          - Target files: /server.ts, /server/capabilities/CapabilityManager.ts, /src/components/PromptStudio.tsx, /src/components/gina-image/GinaImageSettings.tsx, /src/components/gina-image/GinaImagePreview.tsx, /src/components/VRAMHistoryGraph.tsx, /src/components/VRAMOomFrequencyChart.tsx, /server/comfy/WorkflowRegistry.ts, /server/agent/ProjectMapManager.ts.
          - Exact policy change: FLUX image generation now uses flux1-dev-Q4_K_M.gguf + clip_l.safetensors + t5xxl_fp8_e4m3fn.safetensors; the obsolete FLUX.1 Lite/UMT5 identity and the Qwen 2.5-VL mmproj-F16 hard gate were removed from the active FLUX path.
          - Compatibility: the existing flux_lite_image workflow ID remains as a legacy technical identifier so existing local workflow files do not break; it no longer represents a FLUX.1 Lite model.
          - UI: model/status copy now reports FLUX.1 Dev Q4_K_M and the model selector sends flux1-dev-Q4_K_M.gguf.
          """
          if "FLUX.1 Dev Q4_K_M Image-Lane Migration" not in agents_text:
              agents.write_text(agents_text.rstrip() + "\n" + entry.strip() + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          ctext = changelog.read_text(encoding="utf-8")
          centry = """
          ## 2026-09-29 — FLUX.1 Dev Q4_K_M Active Image-Lane Migration

          - Replaced the active FLUX.1 Lite model identity with flux1-dev-Q4_K_M.gguf in the capability registry and Image Studio selector.
          - Removed the /api/jobs hard gate that incorrectly required Qwen 2.5-VL + mmproj-F16.gguf before a direct FLUX image job could run.
          - Updated active status/telemetry copy to report FLUX.1 Dev and the genuine T5-XXL encoder.
          - Retained flux_lite_image only as a backward-compatible workflow identifier so existing local workflow files remain usable; it no longer denotes the retired Lite model.
          """
          if "FLUX.1 Dev Q4_K_M Active Image-Lane Migration" not in ctext:
              changelog.write_text(ctext.rstrip() + centry, encoding="utf-8")

          readme = Path("README.md")
          rtext = readme.read_text(encoding="utf-8")
          rtext = rtext.replace("FLUX.1 Lite & Wan 2.1 execution", "FLUX.1 Dev Q4_K_M & Wan 2.1 execution", 1)
          rtext = rtext.replace("FLUX.1 Lite GGUF", "FLUX.1 Dev Q4_K_M GGUF", 1)
          readme.write_text(rtext, encoding="utf-8")
          PY

      - name: Static migration assertions
        run: |
          python3 <<'PY'
          from pathlib import Path
          checks = {
            "server.ts": [
              'FLUX_GGUF = process.env.FLUX_GGUF || "flux1-dev-Q4_K_M.gguf"',
              "generationModel: 'FLUX.1 Dev GGUF Q4_K_M + T5-XXL FP8'",
              "FLUX.1 Dev text mode cannot use Wan 2.1's UMT5 model",
            ],
            "server/capabilities/CapabilityManager.ts": [
              "id:'flux-dev-gguf'",
              "fileName:'flux1-dev-Q4_K_M.gguf'",
              "id:'flux-dev-image'",
            ],
            "src/components/gina-image/GinaImageSettings.tsx": [
              "FLUX.1 Dev",
              "flux1-dev-Q4_K_M.gguf",
            ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"ASSERTION FAILED: {path}: {needle}")
          server = Path("server.ts").read_text(encoding="utf-8")
          if "FLUX.1 Lite high-precision mode requires Qwen 2.5-VL Vision Mode with mmproj-F16." in server:
              raise SystemExit("Stale FLUX Lite/Qwen projector hard gate remains in server.ts")
          print("Static assertions passed.")
          PY

      - name: Build changed-files-only ZIP
        env:
          BASE_SHA: a06193332748cd27113a6ce881156f6f09776650
        run: |
          mkdir -p dist
          python3 <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          base = os.environ["BASE_SHA"]
          names = subprocess.check_output(["git", "diff", "--name-only", base], text=True).splitlines()
          names = [n for n in names if n and Path(n).is_file() and not n.startswith(".github/")]
          if not names:
              raise SystemExit("No changed source files were produced.")
          out = Path("dist/Gina-AI-FLUX-Dev-Update-2026-09-29.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  z.write(n, n)
          print("Changed files:", *names, sep="\n - ")
          print(out)
          PY

      - name: Commit migrated source
        run: |
          git config user.name "Gina AI Migration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CHANGELOG.md README.md server.ts server/capabilities/CapabilityManager.ts src/components/PromptStudio.tsx src/components/gina-image/GinaImageSettings.tsx src/components/gina-image/GinaImagePreview.tsx src/components/VRAMHistoryGraph.tsx src/components/VRAMOomFrequencyChart.tsx server/comfy/WorkflowRegistry.ts server/agent/ProjectMapManager.ts
          git commit -m "fix(image): migrate active lane to FLUX.1 Dev Q4_K_M [skip ci]" || echo "No source commit needed"
          git push origin HEAD:fix/flux-dev-image-lane

      - name: Upload changed-files-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gina-AI-FLUX-Dev-Update-2026-09-29
          path: dist/Gina-AI-FLUX-Dev-Update-2026-09-29.zip
          if-no-files-found: error
          retention-days: 14
