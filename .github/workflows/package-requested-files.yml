name: Package requested changed files
on:
  push:
    branches:
      - tmp/package-devmode-wan22-zip
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build changed-files ZIP
        run: |
          mkdir -p package/server/comfy package/server package/src/components package/src
          cp CHANGELOG.md package/CHANGELOG.md
          cp Start_Gina_Development.bat package/Start_Gina_Development.bat
          cp server.ts package/server.ts
          cp server/DevelopmentModeService.ts package/server/DevelopmentModeService.ts
          cp server/comfy/WorkflowParser.ts package/server/comfy/WorkflowParser.ts
          cp src/App.tsx package/src/App.tsx
          cp src/components/DevelopmentModePanel.tsx package/src/components/DevelopmentModePanel.tsx
          cp src/components/VideoStudio.tsx package/src/components/VideoStudio.tsx
          cd package
          zip -r ../Gina-DevelopmentMode-Wan22-Update.zip .
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gina-DevelopmentMode-Wan22-Update
          path: Gina-DevelopmentMode-Wan22-Update.zip
