name: Build static Development Mode dashboard

on:
  push:
    branches:
      - "fix/development-mode-static-dashboard"

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build browser dashboard only
        run: npx vite build

      - name: Verify static build
        run: |
          test -f dist/index.html
          find dist -type f | sort

      - name: Commit static dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "No dashboard build changes to commit."
            exit 0
          fi
          git commit -m "build: include static dashboard for Development Mode"
          git push origin HEAD:${GITHUB_REF_NAME}
