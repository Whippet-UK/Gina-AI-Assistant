name: Build static Development Mode dashboard

on:
  push:
    branches:
      - "fix/development-mode-static-dashboard"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build browser dashboard only
        run: npx vite build

      - name: Verify static build
        run: |
          test -f dist/index.html
          find dist -type f | sort

      - name: Upload static dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: gina-development-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
