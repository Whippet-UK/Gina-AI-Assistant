[package]
name = "gina_math"
version = "0.1.0"
edition = "2021"
description = "Gina hot-path math kernels (motion curves + telemetry smoothing) for WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# No external deps — pure no_std C-ABI exports for maximum portability.
